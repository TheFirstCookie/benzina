name: Pret Carburanti ANRE

on:
  schedule:
    - cron: '7 5 * * 1-5'
    - cron: '37 6 * * 1-5'
    - cron: '7 8 * * 1-5'
    - cron: '37 9 * * 1-5'
    - cron: '7 11 * * 1-5'
    - cron: '7 13 * * 1-5'
  workflow_dispatch:         # rulare manuala din GitHub: trimite imediat

jobs:
  send-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: send-prices-${{ github.event_name }}
      cancel-in-progress: false
    steps:
      - name: Data de azi (Moldova)
        id: today
        run: echo "date=$(TZ=Europe/Chisinau date +%F)" >> "$GITHUB_OUTPUT"

      - name: Verific daca mesajul de azi a fost deja trimis
        id: sent
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v6
        with:
          path: sent.marker
          key: sent-${{ steps.today.outputs.date }}
          lookup-only: true

      - uses: actions/checkout@v7
        if: steps.sent.outputs.cache-hit != 'true'

      - uses: actions/setup-python@v7
        if: steps.sent.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'

      - name: Instalare dependențe
        if: steps.sent.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Rulare bot
        if: steps.sent.outputs.cache-hit != 'true'
        run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID:   ${{ secrets.CHAT_ID }}
          TIMEZONE:  Europe/Chisinau
          SEND_AT:   ${{ github.event_name == 'schedule' && '12:15' || '' }}

      - name: Marchez mesajul de azi ca trimis
        if: github.event_name == 'schedule' && steps.sent.outputs.cache-hit != 'true'
        run: touch sent.marker

      - uses: actions/cache/save@v6
        if: github.event_name == 'schedule' && steps.sent.outputs.cache-hit != 'true'
        with:
          path: sent.marker
          key: sent-${{ steps.today.outputs.date }}
