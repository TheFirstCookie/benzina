name: Pret Carburanti ANRE

on:
  schedule:
    # Early opportunities cover the observed 7-9 hour schedule-event delays.
    # Runs arriving before 07:15 local exit without a delivery marker.
    - cron: '17 0,2,4,6 * * 1-5'
    - cron: '7 8 * * 1-5'
    - cron: '37 9 * * 1-5'
    - cron: '7 11 * * 1-5'
    - cron: '7 13 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Test scraping and chart generation without sending Telegram'
        type: boolean
        default: false
      debug:
        description: 'Enable detailed application logging'
        type: boolean
        default: false
      automated:
        description: 'Respect daily delivery marker and wait for 12:50 Chisinau time'
        type: boolean
        default: false
      history_json:
        description: 'Optional fresh ANRE publication history from dispatch_prices.py'
        type: string
        default: ''

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  MPLBACKEND: Agg
  AUTOMATED: ${{ github.event_name == 'schedule' || inputs.automated }}
  DRY_RUN: ${{ inputs.dry_run }}

jobs:
  send-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: send-prices
      cancel-in-progress: false
    steps:
      - name: Data de azi (Moldova)
        id: today
        run: |
          echo "date=$(TZ=Europe/Chisinau date +%F)" >> "$GITHUB_OUTPUT"
          eligible=true
          local_time=$(TZ=Europe/Chisinau date +%H%M)
          if [[ "$GITHUB_EVENT_NAME" == 'schedule' ]] && (( 10#$local_time < 715 )); then
            eligible=false
            echo 'Early schedule opportunity: a later run will prepare the report.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

      - name: Verific daca mesajul de azi a fost deja trimis
        id: sent
        if: steps.today.outputs.eligible == 'true' && env.AUTOMATED == 'true' && env.DRY_RUN != 'true'
        uses: actions/cache/restore@v6
        with:
          path: sent.marker
          key: sent-${{ steps.today.outputs.date }}
          lookup-only: true

      - uses: actions/checkout@v7
        if: steps.today.outputs.eligible == 'true' && steps.sent.outputs.cache-hit != 'true'

      - uses: actions/setup-python@v7
        if: steps.today.outputs.eligible == 'true' && steps.sent.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'

      - name: Instalare dependențe
        if: steps.today.outputs.eligible == 'true' && steps.sent.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Test bot
        if: steps.today.outputs.eligible == 'true' && steps.sent.outputs.cache-hit != 'true'
        run: python -m unittest -v

      - name: Runtime diagnostics
        if: steps.today.outputs.eligible == 'true' && steps.sent.outputs.cache-hit != 'true'
        run: |
          mkdir -p diagnostics
          {
            date -u
            TZ=Europe/Chisinau date
            python --version
            python -m pip freeze
            echo "Runner: $RUNNER_OS $RUNNER_ARCH"
            echo "Event: $GITHUB_EVENT_NAME Run: $GITHUB_RUN_ID Attempt: $GITHUB_RUN_ATTEMPT"
          } | tee diagnostics/runtime.txt

      - name: Rulare bot
        id: bot
        if: steps.today.outputs.eligible == 'true' && steps.sent.outputs.cache-hit != 'true'
        run: |
          args=()
          if [[ "$DRY_RUN" == 'true' ]]; then args+=(--dry-run); fi
          if [[ "$DEBUG" == 'true' ]]; then args+=(--debug); fi
          python bot.py "${args[@]}"
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          DEBUG: ${{ inputs.debug }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID:   ${{ secrets.CHAT_ID }}
          TIMEZONE:  Europe/Chisinau
          SEND_AT:   ${{ (github.event_name == 'schedule' || inputs.automated) && '12:50' || '' }}
          ANRE_HISTORY_JSON: ${{ inputs.history_json }}

      - name: Marchez mesajul de azi ca trimis
        if: steps.bot.outcome == 'success' && env.DRY_RUN != 'true' && steps.sent.outputs.cache-hit != 'true'
        run: touch sent.marker

      - uses: actions/cache/save@v6
        if: steps.bot.outcome == 'success' && env.DRY_RUN != 'true' && steps.sent.outputs.cache-hit != 'true'
        with:
          path: sent.marker
          key: sent-${{ steps.today.outputs.date }}

      - name: Network diagnostics on failure
        if: failure()
        timeout-minutes: 3
        run: |
          mkdir -p diagnostics
          {
            for host in anre.md www.anre.md logos-pres.md api.telegram.org; do
              echo "=== DNS: $host ==="
              getent ahosts "$host" || true
              echo "=== HTTPS: $host ==="
              curl --connect-timeout 10 --max-time 20 --silent --show-error \
                --output /dev/null --write-out 'HTTP=%{http_code} IP=%{remote_ip} connect=%{time_connect}s TLS=%{time_appconnect}s total=%{time_total}s\n' \
                "https://$host/" || true
            done
          } 2>&1 | tee diagnostics/network.txt

      - name: Workflow summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CACHE_HIT: ${{ steps.sent.outputs.cache-hit }}
          BOT_OUTCOME: ${{ steps.bot.outcome }}
          ELIGIBLE: ${{ steps.today.outputs.eligible }}
        run: |
          {
            echo "### Fuel price workflow"
            echo "- Job: $JOB_STATUS"
            echo "- Eligible send window: $ELIGIBLE"
            echo "- Already sent today: ${CACHE_HIT:-false}"
            echo "- Bot step: ${BOT_OUTCOME:-not started}"
            echo "- Download the diagnostics artifact for logs, ANRE responses, chart and network checks."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        if: always() && steps.today.outputs.eligible == 'true' && steps.sent.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/
          retention-days: 14
          if-no-files-found: warn
